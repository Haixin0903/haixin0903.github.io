<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haixin的小站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #e0f7ff, #f0f4f8, #ffe9f5);
            background-size: 200% 200%;
            font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            animation: bgMove 12s ease infinite;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .box {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 520px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transform: translateY(30px);
            opacity: 0;
            animation: boxIn 1s ease forwards;
        }

        @keyframes boxIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            color: #2d3748;
            margin-bottom: 18px;
            font-size: 32px;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(20px);
            animation: titleIn 1s ease 0.3s forwards;
        }

        @keyframes titleIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .wave {
            display: inline-block;
            animation: wave 2s ease-in-out infinite;
            transform-origin: 70% 70%;
        }

        @keyframes wave {
            0%, 60%, 100% { transform: rotate(0deg); }
            10%, 30% { transform: rotate(14deg); }
            20% { transform: rotate(-8deg); }
            40% { transform: rotate(10deg); }
            50% { transform: rotate(-4deg); }
        }

        p {
            color: #555;
            font-size: 17px;
            line-height: 1.9;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(12px);
        }

        p:nth-child(2) {
            animation: textIn 0.8s ease 0.8s forwards;
        }

        p:nth-child(3) {
            animation: textIn 0.8s ease 1.1s forwards;
        }

        p:nth-child(4) {
            animation: textIn 0.8s ease 1.4s forwards;
        }

        @keyframes textIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: white;
            text-decoration: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 10px 24px rgba(116, 185, 255, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            animation: btnIn 0.8s ease 1.7s forwards;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 14px 30px rgba(116, 185, 255, 0.5);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes btnIn {
            to {
                opacity: 1;
            }
        }

        .float {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            animation: floatUp linear infinite;
            opacity: 0.7;
            pointer-events: none;
        }

        .ball1 {
            width: 80px;
            height: 80px;
            left: 10%;
            bottom: -120px;
            animation-duration: 14s;
        }

        .ball2 {
            width: 120px;
            height: 120px;
            right: 8%;
            bottom: -160px;
            animation-duration: 18s;
            animation-delay: -4s;
        }

        .ball3 {
            width: 60px;
            height: 60px;
            left: 30%;
            bottom: -100px;
            animation-duration: 16s;
            animation-delay: -8s;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-60vh) translateX(40px);
            }
            100% {
                transform: translateY(-110vh) translateX(-30px);
            }
        }

        @media (max-width: 480px) {
            .box {
                padding: 30px 24px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="float ball1"></div>
    <div class="float ball2"></div>
    <div class="float ball3"></div>

    <div class="box">
        <h1><span class="wave">🎉</span> 欢迎来到 Haixin 的小站</h1>
        <p>这是我用 GitHub Pages 搭建的第一个个人网站</p>
        <p>以后会在这里放文字、图片和更多有趣内容</p>
        <p>慢慢来，一点点把它变成喜欢的样子 ✨</p>
        <a class="btn" href="https://github.com/Haixin0903" target="_blank">去看看我的主页</a>
    </div>
</body>
</html>
