<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoungStar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #d7e1ff, #e6d4ff, #f7e4ff);
            background-size: 300% 300%;
            padding: 24px 16px;
            min-height: 100vh;
            animation: bgMove 10s ease infinite;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            max-width: 420px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.4);
            opacity: 0;
            transform: translateY(24px);
            animation: cardIn 0.9s ease forwards;
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .banner {
            height: 220px;
            background: linear-gradient(135deg, rgba(132, 160, 245, 0.85), rgba(166, 136, 232, 0.85));
            position: relative;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #fff;
            position: absolute;
            left: 24px;
            bottom: -45px;
            background: #e8e8e8;
            object-fit: cover;
        }

        .info {
            padding: 56px 24px 24px;
        }

        .name {
            font-size: 24px;
            font-weight: 600;
            color: #1d2129;
            margin-bottom: 6px;
        }

        .id {
            color: #86909c;
            font-size: 15px;
            margin-bottom: 16px;
        }

        .desc {
            font-size: 15px;
            color: #4e5969;
            line-height: 1.65;
            margin-bottom: 22px;
        }

        .follow-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: rgba(29, 33, 41, 0.8);
            color: #fff;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 500;
            transition: 0.25s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .follow-btn:hover {
            background: rgba(29, 33, 41, 0.92);
            transform: translateY(-2px);
        }

        .stat-row {
            display: flex;
            justify-content: space-around;
            padding: 20px 0;
            border-top: 1px solid rgba(242, 243, 245, 0.4);
            border-bottom: 1px solid rgba(242, 243, 245, 0.4);
            margin: 10px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-num {
            font-size: 18px;
            font-weight: 600;
            color: #1d2129;
        }

        .stat-text {
            font-size: 13px;
            color: #86909c;
            margin-top: 3px;
        }

        .works-title {
            padding: 16px 24px 8px;
            font-size: 16px;
            font-weight: 600;
            color: #1d2129;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding: 0 24px 24px;
        }

        .grid-item {
            aspect-ratio: 1;
            background: rgba(242, 243, 245, 0.5);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.25s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .grid-item:hover {
            transform: scale(1.04);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="banner">
            <div class="avatar"></div>
        </div>

        <div class="info">
            <div class="name">YoungStar</div>
            <div class="id">@haixin0903</div>
            <div class="desc">
                喜欢记录、探索有趣的东西，慢慢搭建属于自己的小空间✨
            </div>
            <button class="follow-btn">Visit Github</button>
        </div>

        <div class="stat-row">
            <div class="stat-item">
                <div class="stat-num">28</div>
                <div class="stat-text">关注</div>
            </div>
            <div class="stat-item">
                <div class="stat-num">106</div>
                <div class="stat-text">粉丝</div>
            </div>
            <div class="stat-item">
                <div class="stat-num">9</div>
                <div class="stat-text">作品</div>
            </div>
        </div>

        <div class="works-title">作品</div>

        <div class="grid">
            <div class="grid-item"></div>
            <div class="grid-item"></div>
            <div class="grid-item"></div>
        </div>
    </div>
</body>
</html>
