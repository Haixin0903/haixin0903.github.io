<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的小网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f0f4f8;
            font-family: "Microsoft Yahei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .box {
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2d3748;
            margin-bottom: 16px;
        }
        p {
            color: #666;
            font-size: 17px;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 欢迎来到我的网页</h1>
        <p>这是我用 GitHub Pages 搭建的第一个网站</p>
        <p>以后可以在这里放文字、图片、更多好玩的内容</p>
    </div>
</body>
</html>
